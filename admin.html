<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>관리자 도구 — GLOW SEOUL</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#000000">
<link rel="icon" href="icons/icon-192-v2.png">
<link rel="apple-touch-icon" href="icons/icon-192-v2.png">
<link rel="stylesheet" href="css/app.css?v=81">
</head>
<body>
<header class="topbar">
  <a class="back" href="index.html">←</a>
  <div class="tt"><span class="brand">GLOW SEOUL</span><span class="title">관리자 도구 <span class="sub">관리자</span></span></div>
</header>
<div class="wrap">

  <!-- ★관리용 화면은 전부 여기로 모은다★ (2026-08-26 담당자 결정) — 홈은 매장 사람도 보는
       자리라 관리 도구가 늘어날수록 카드가 붐빈다. 관리자만 들어오는 이 화면을 입구로 삼고,
       새 관리 도구가 생기면 홈이 아니라 아래 목록에 한 줄씩 더한다. -->
  <section class="card">
    <h2>관리 화면</h2>
    <nav class="menu">
      <a class="menuCard" href="codes.html">
        <span class="mi"><span class="mt">제출 코드 관리</span><span class="md">고객 설문 QR·제출 코드 발급</span></span>
        <span class="arrow">›</span>
      </a>
      <a class="menuCard" href="accounts.html">
        <span class="mi"><span class="mt">계정 관리</span><span class="md">매장 계정 비밀번호와 사용 여부</span></span>
        <span class="arrow">›</span>
      </a>
    </nav>
  </section>

  <section class="card">
    <h2>제출 되돌리기</h2>
    <!-- ★재제출과는 다른 일이다★ — 같은 달에 또 내는 경우는 제출할 때 서버가 먼저 되묻고
         알아서 정리한다. 이 칸은 '잘못 낸 것을 취소'하거나 '시험 삼아 낸 것을 원상복구'할 때만 쓴다. -->
    <p class="note">잘못 낸 제출을 지웁니다. 매장을 고르면 그 매장의 제출 목록이 나옵니다.<br>
      지우기 전에 <b>무엇을 지울지 먼저 보여 드리고</b>, 확인하셔야 실제로 지웁니다.<br>
      사진은 <b>휴지통</b>으로 갑니다(30일 안에 되찾을 수 있습니다).</p>
    <div class="meta-grid">
      <div class="full"><label class="f">매장</label><select id="store"><option value="">매장 선택</option></select></div>
    </div>
    <div id="subList"></div>
    <div id="undoPlan"></div>
  </section>

  <!-- 2026-08-26: 「쓰기 스위치」 칸은 뺐다 (담당자 판단).
       ★서버 스위치 자체는 그대로 살아 있다★ — 매장 파일·통합시트 쓰기를 멈추는 차단기이고,
       화면에 두면 잘못 눌러 꺼 둔 채 잊는 쪽이 더 위험하다(그 뒤 제출은 다 되는데 기록만 안 된다).
       테스트 목적으로 끌 이유도 없어졌다 — 되돌리기가 그 제출이 쓴 자리를 전부 되돌린다.
       급할 때는 콘솔로:
         await Api.call('admin.switches', {})            // 지금 상태 보기
         await Api.call('admin.switches', {on:false})    // 세 개 끄기 (차단)
         await Api.call('admin.switches', {on:true})     // 다시 켜기 -->

</div>

<!-- auth.js는 항상 가장 먼저. 이 화면은 본사 담당자 전용 도구라 세션이 없으면 login.html로 보낸다.
     ★인자 'accounts'를 반드시 넘긴다★ — 서버의 admin.* 액션이 전부 menu:'accounts' 로 등록돼 있어
       권한의 정본이 그것이다. 여기에 새 메뉴 키를 만들면 구글시트 「역할」 탭까지 고쳐야 하고,
       고치기 전까지는 아무에게도 안 보인다. 같은 열쇠를 쓰는 편이 맞다.
     이것은 안내를 앞당기는 장치일 뿐 보안이 아니다 — 진짜 차단은 서버 ACTIONS 등록표와 can()이다. -->
<script src="js/auth.js?v=81"></script>
<script>if (typeof Auth !== 'undefined' && Auth.guard) Auth.guard('accounts');</script>
<script src="js/api.js?v=81"></script>
<script src="js/admin-app.js?v=81"></script>
<script>if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js');</script>
</body>
</html>
