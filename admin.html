<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>관리자 도구 — GLOW SEOUL</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#000000">
<link rel="icon" href="icons/icon-192-v2.png">
<link rel="apple-touch-icon" href="icons/icon-192-v2.png">
<link rel="stylesheet" href="css/app.css?v=65">
</head>
<body>
<header class="topbar">
  <a class="back" href="index.html">←</a>
  <div class="tt"><span class="brand">GLOW SEOUL</span><span class="title">관리자 도구 <span class="sub">관리자</span></span></div>
</header>
<div class="wrap">

  <section class="card">
    <h2>제출 되돌리기</h2>
    <!-- 2026-08-26: 그동안 이 기능은 서버에만 있고 브라우저 콘솔로만 부를 수 있었다.
         날짜를 외워서 정확히 타이핑해야 했고, 한 글자만 틀려도 '되돌릴 게 없다'로 끝나
         담당자가 그것을 '이미 지워졌다'로 잘못 읽을 수 있는 자리였다. 그래서 고르게 만든다. -->
    <p class="note">잘못 낸 제출을 지웁니다. 매장을 고르면 그 매장의 제출 목록이 나옵니다.<br>
      지우기 전에 <b>무엇을 지울지 먼저 보여 드리고</b>, 확인하셔야 실제로 지웁니다.</p>
    <div class="meta-grid">
      <div class="full"><label class="f">매장</label><select id="store"><option value="">매장 선택</option></select></div>
    </div>
    <div id="subList"></div>
    <div id="undoPlan"></div>
  </section>

  <section class="card">
    <h2>쓰기 스위치</h2>
    <!-- 스크립트 속성이 50개를 넘어 구글 설정 화면이 읽기 전용이 되었다.
         그래서 이 세 개는 앱에서만 바꿀 수 있다(서버 admin.switches). -->
    <p class="note">앱 제출이 <b>매장 파일과 통합시트에 실제로 기록될지</b>를 정합니다.
      세 개가 함께 움직입니다.<br>
      ⚠<b>끄면</b> 제출은 되지만 매장 파일·통합시트에는 아무것도 안 들어갑니다
      (점수만 확인하고 싶을 때).</p>
    <div id="swState" class="codeSum"></div>
    <div class="bcAct">
      <button class="miniBtn" id="swShow">지금 상태 보기</button>
      <button class="miniBtn" id="swOn">세 개 켜기</button>
      <button class="miniBtn warn" id="swOff">세 개 끄기</button>
    </div>
  </section>

</div>

<!-- auth.js는 항상 가장 먼저. 이 화면은 본사 담당자 전용 도구라 세션이 없으면 login.html로 보낸다.
     ★인자 'accounts'를 반드시 넘긴다★ — 서버의 admin.* 액션이 전부 menu:'accounts' 로 등록돼 있어
       권한의 정본이 그것이다. 여기에 새 메뉴 키를 만들면 구글시트 「역할」 탭까지 고쳐야 하고,
       고치기 전까지는 아무에게도 안 보인다. 같은 열쇠를 쓰는 편이 맞다.
     이것은 안내를 앞당기는 장치일 뿐 보안이 아니다 — 진짜 차단은 서버 ACTIONS 등록표와 can()이다. -->
<script src="js/auth.js?v=65"></script>
<script>if (typeof Auth !== 'undefined' && Auth.guard) Auth.guard('accounts');</script>
<script src="js/api.js?v=65"></script>
<script src="js/admin-app.js?v=65"></script>
<script>if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js');</script>
</body>
</html>
