  <!-- ★관리용 화면은 전부 여기로 모은다★ (2026-08-26 담당자 결정) — 홈은 매장 사람도 보는
       자리라 관리 도구가 늘어날수록 카드가 붐빈다. 관리자만 들어오는 이 화면을 입구로 삼고,
       새 관리 도구가 생기면 홈이 아니라 아래 목록에 한 줄씩 더한다. -->
  <section class="card">
    <h2>관리 화면</h2>
    <nav class="menu">
      <a class="menuCard" href="codes.html">
        <span class="mi"><span class="mt">제출 코드 관리</span><span class="md">고객 설문 QR·제출 코드 발급</span></span>

      </a>

  <!-- 2026-08-27: 「제출 되돌리기」 칸은 submits.html 로 옮겼다 (담당자 요청).
       관리 화면 셋이 전부 같은 모습이 되도록 — 목록에서 한 줄을 누르면 그 화면으로 들어간다.
       앞으로 관리 도구가 늘어도 위 목록에 한 줄씩만 더하면 되고 이 화면이 붐비지 않는다. -->

  <!-- ★쓰기 스위치는 2026-08-27에 통째로 지웠다★ (담당자 결정) — 화면도 서버도 없다.
       셋 다 기본값이 '꺼짐'이라 스크립트 속성이 비기만 해도 잠겼고, 그러면 화면엔
       「저장 완료」가 뜨는데 시트는 비어 있었다. 10/1에 밟을 함정이라 없앴다.
       잘못 들어간 제출은 위 「제출 관리」에서 되돌린다. -->

</div>

<!-- auth.js는 항상 가장 먼저. 이 화면은 본사 담당자 전용 도구라 세션이 없으면 login.html로 보낸다.
     ★인자 'accounts'를 반드시 넘긴다★ — 서버의 admin.* 액션이 전부 menu:'accounts' 로 등록돼 있어
       권한의 정본이 그것이다. 여기에 새 메뉴 키를 만들면 구글시트 「역할」 탭까지 고쳐야 하고,
       고치기 전까지는 아무에게도 안 보인다. 같은 열쇠를 쓰는 편이 맞다.
     이것은 안내를 앞당기는 장치일 뿐 보안이 아니다 — 진짜 차단은 서버 ACTIONS 등록표와 can()이다. -->
<script src="js/auth.js?v=89"></script>
<script>if (typeof Auth !== 'undefined' && Auth.guard) Auth.guard('accounts');</script>
<script src="js/api.js?v=89"></script>
<script>if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js');</script>
