<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>관리자 도구 — GLOW SEOUL</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#000000">
<link rel="icon" href="icons/icon-192-v2.png">
<link rel="apple-touch-icon" href="icons/icon-192-v2.png">
<link rel="stylesheet" href="css/app.css?v=68">
</head>
<body>
<header class="topbar">
  <a class="back" href="index.html">←</a>
  <div class="tt"><span class="brand">GLOW SEOUL</span><span class="title">관리자 도구 <span class="sub">관리자</span></span></div>
</header>
<div class="wrap">

  <!-- ★관리용 화면은 전부 여기로 모은다★ (2026-08-26 담당자 결정) — 홈은 매장 사람도 보는
       자리라 관리 도구가 늘어날수록 카드가 붐빈다. 관리자만 들어오는 이 화면을 입구로 삼고,
       새 관리 도구가 생기면 홈이 아니라 아래 목록에 한 줄씩 더한다. -->
  <section class="card">
    <h2>관리 화면</h2>
    <nav class="menu">
      <a class="menuCard" href="codes.html">
        <span class="mi"><span class="mt">제출 코드 관리</span><span class="md">고객 설문 QR·제출 코드 발급</span></span>
        <span class="arrow">›</span>
      </a>
      <a class="menuCard" href="accounts.html">
        <span class="mi"><span class="mt">계정 관리</span><span class="md">매장 계정 비밀번호와 사용 여부</span></span>
        <span class="arrow">›</span>
      </a>
    </nav>
  </section>

  <!-- 2026-08-26: 「제출 되돌리기」 칸은 뺐다. 구조를 다시 잡은 뒤에 넣기로 했다(담당자 결정).
       ★서버 기능은 그대로 살아 있다★ — admin.undoSubmit 이고, 지금은 브라우저 콘솔로 부른다:
         await Api.call('admin.undoSubmit', {store:'금종제과', date:'2026-10-05'})   // 미리보기
         … 여기에 apply:true 를 더하면 실행. 무엇이 지워지는지는 작업재개.md 참조. -->

  <section class="card">
    <h2>쓰기 스위치</h2>
    <!-- 스크립트 속성이 50개를 넘어 구글 설정 화면이 읽기 전용이 되었다.
         그래서 이 세 개는 앱에서만 바꿀 수 있다(서버 admin.switches). -->
    <p class="note">앱 제출이 <b>매장 파일과 통합시트에 실제로 기록될지</b>를 정합니다.
      세 개가 함께 움직입니다.<br>
      ⚠<b>끄면</b> 제출은 되지만 매장 파일·통합시트에는 아무것도 안 들어갑니다
      (점수만 확인하고 싶을 때).</p>
    <div id="swState" class="codeSum"></div>
    <div class="bcAct">
      <button class="miniBtn" id="swShow">지금 상태 보기</button>
      <button class="miniBtn" id="swOn">세 개 켜기</button>
      <button class="miniBtn warn" id="swOff">세 개 끄기</button>
    </div>
  </section>

</div>

<!-- auth.js는 항상 가장 먼저. 이 화면은 본사 담당자 전용 도구라 세션이 없으면 login.html로 보낸다.
     ★인자 'accounts'를 반드시 넘긴다★ — 서버의 admin.* 액션이 전부 menu:'accounts' 로 등록돼 있어
       권한의 정본이 그것이다. 여기에 새 메뉴 키를 만들면 구글시트 「역할」 탭까지 고쳐야 하고,
       고치기 전까지는 아무에게도 안 보인다. 같은 열쇠를 쓰는 편이 맞다.
     이것은 안내를 앞당기는 장치일 뿐 보안이 아니다 — 진짜 차단은 서버 ACTIONS 등록표와 can()이다. -->
<script src="js/auth.js?v=68"></script>
<script>if (typeof Auth !== 'undefined' && Auth.guard) Auth.guard('accounts');</script>
<script src="js/api.js?v=68"></script>
<script src="js/admin-app.js?v=68"></script>
<script>if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js');</script>
</body>
</html>
