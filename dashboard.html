<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<!-- 화면 이름은 'QSC 전체 대시보드'로 통일한다 (index.html 카드 문구 · js/menu.js REG와 한 글자까지 같다).
     누른 카드 이름과 들어간 화면 제목이 다르면 "다른 화면에 왔다"는 문의가 생긴다.
     ★'순위표'라는 이름을 쓰지 않는다★ — 이 화면은 매장을 줄 세우려고 만든 것이 아니라
       전 매장 현황을 함께 보고 개선점을 찾으라고 만든 것이다. 이름이 목적을 배신하면 안 된다. -->
<title>QSC 전체 대시보드 — GLOW SEOUL</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#000000">
<link rel="icon" href="icons/icon-192-v2.png">
<link rel="apple-touch-icon" href="icons/icon-192-v2.png">
<link rel="stylesheet" href="css/app.css?v=57">
</head>
<body>
<!-- topbar (c)형 = 뒤로 + 제목 + 우측 조작 버튼. 조작 버튼은 '수동 새로고침' 하나뿐이다 —
     월 단위 데이터이고 시트 읽기 쿼터가 걸려 있어 자동 폴링을 하지 않는다. -->
<header class="topbar">
  <a class="back" href="index.html">←</a>
  <div class="tt"><span class="brand">GLOW SEOUL</span><span class="title">QSC 전체 대시보드 <span class="sub" id="whoInfo"></span></span></div>
  <span class="sub" id="freshInfo"></span>
  <button id="reloadBtn" class="resetBtn">새로고침</button>
</header>

<div class="wrap">
  <!-- 점검 모드 안내. warnNote와 따로 두는 이유: warnNote는 표를 그릴 때마다 통째로 다시 쓰이므로
       거기에 점검 문구를 얹으면 다음 렌더에서 조용히 지워진다. -->
  <p class="note mockNote" id="maintNote" style="display:none"></p>

  <!-- 산식 경계 경고 · 오프라인 안내가 들어간다. 평소에는 숨어 있다. -->
  <p class="note mockNote" id="warnNote" style="display:none"></p>

  <!-- '이번 달 진행'(미제출 현황판) 카드가 여기 있었다. 2026-08-16 제거.
       서버의 status.month 액션과 css/app.css의 .msRow/.msHead/.progressbar/.msMiss/.msMore는
       지우지 않고 남겨 두었다 — 되살릴 때 이 자리에 카드만 다시 넣으면 된다. -->

  <section class="card">
    <div class="meta-grid">
      <div class="full"><label class="f">기간</label><select id="period"></select></div>
    </div>
    <div class="codeSum" id="stats"></div>
  </section>

  <section class="card">
    <!-- 등수를 찍지 않는다. 점수 순으로 정렬만 하고 'N위' 열은 두지 않는다 —
         비교로 개선 동기를 만들되 서열을 못 박지 않는 것이 이 표의 목적이다. -->
    <h2>전 매장 현황</h2>
    <p class="note" id="stateNote">불러오는 중입니다…</p>
    <div class="tableScroll">
      <table class="sumTable" id="rankTable">
        <thead><tr id="rankHead"></tr></thead>
        <tbody id="rankBody"></tbody>
      </table>
    </div>
    <p class="note" id="adminNote" style="display:none"></p>
    <p class="note" id="trust"></p>
    <p class="note">점수는 본사 집계 후 반영됩니다.</p>
  </section>
</div>

<script src="js/auth.js?v=57"></script>
<script src="js/api.js?v=57"></script>
<script src="js/dashboard-app.js?v=57"></script>
<script>if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js');</script>
</body>
</html>
