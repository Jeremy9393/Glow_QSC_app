<script>
(async function () {
  const $ = function (s, el) { return (el || document).querySelector(s); };

  /* ★로그인 벽 (서버 스크립트 속성 AUTH_ENFORCE와 짝을 이룬다).
     v35에서 true로 올렸다 — 세션이 없으면 홈은 login.html?next=index.html로 보낸다.
     ★이 값은 화면 쪽 안내일 뿐 보안이 아니다★ — 진짜 차단은 서버 AUTH_ENFORCE='on'이 한다.
       그쪽은 코드가 아니라 사람이 스크립트 속성에서 켠다(두 스위치는 따로 논다).
       여기만 켜 두면 주소를 직접 친 사람은 여전히 각 화면에 닿을 수 있고,
       저쪽만 켜 두면 홈은 열리지만 모든 요청이 거절돼 화면이 텅 빈다. 같이 켜는 것이 맞다.
     ★되돌릴 때★ — 이 값을 false로 내리고 서버 AUTH_ENFORCE도 'off'로 함께 내린다.
       한쪽만 내리면 위 두 어긋난 상태 중 하나가 된다.
     ★홈은 qsc.html로 들어가는 유일한 입구다★ — 그래서 아래 세 안전장치를 지운 채로
       이 값을 true로 두면 안 된다: ①저장소가 막힌 기기는 벽을 세우지 않는다(무한 왕복 방지)
       ②확실히 오프라인이면 벽을 세우지 않는다(지하 매장에서 그날 점검이 통째로 막힌다)
       ③qsc.html·shopper.html은 여전히 리다이렉트 없는 '부드러운 가드'다(현장 점검 보호). */
  const LOGIN_GATE = true;

  const hasAuth = typeof Auth !== 'undefined' && Auth;

  // ---------- 가드 ----------
  /* 이 기기에 세션을 저장할 수 있는가. 못 하면(사파리 사생활 모드·저장소 차단) 로그인 벽을
     세우지 않는다 — 세우면 로그인 화면으로 보내고, 로그인에 성공해도 세션을 남기지 못해
     홈으로 돌아오는 순간 다시 로그인 화면으로 가는 무한 왕복이 된다.
     구버전 auth.js가 캐시에 남아 storageOk가 없으면 판정하지 않고 종전대로 진행한다. */
  function storageBlocked() {
    try {
      return !!(hasAuth && typeof Auth.storageOk === 'function' && !Auth.storageOk());
    } catch (e) { return false; }
  }
  /* 지금 확실히 오프라인인가. 확실할 때만 참이다(모르면 거짓 — 과하게 열리지 않는다).
     ★오프라인이면 벽을 세우지 않는 이유★ — 로그인은 서버 왕복이라 전파가 없으면 100% 실패한다.
       그런데 홈은 qsc.html로 들어가는 유일한 입구다. 지하 매장에서 세션이 없는 채로 도착하면
       (아이폰은 홈 화면에 설치하지 않은 PWA의 저장소를 7일 미사용 시 지우는데 QSC 점검은
       월 1회다 — 즉 매달 그 상태로 도착한다) 벽 → 로그인 화면 → 네트워크 오류에서 끝나
       그날 점검 자체를 시작할 수 없다. 벽이 막아야 할 것은 '남의 데이터'인데,
       그건 여기서가 아니라 서버가 막는다(토큰 없는 요청은 전부 거절된다).
       이 갈래로 홈이 열려도 보이는 것은 화면 이름뿐이고, 나가는 데이터는 한 줄도 없다.
     저장소 차단(위)과 같은 성격의 예외다 — 둘 다 '벽이 사고를 만드는 경우'를 비켜 간다. */
  const offlineNow = (navigator.onLine === false);
  if (LOGIN_GATE && !offlineNow && !storageBlocked() && hasAuth && typeof Auth.guard === 'function') {
    /* ★ensure()가 아니라 guard()다. ensure()는 화면을 옮기지 않으므로(어디로 보낼지는 화면이
       정한다는 것이 auth.js의 설계다), 그것으로 바꾸면 홈이 로그인 화면으로 가지 않고
       그냥 빈 화면이 된다. guard()가 login.html?next=index.html로 보낸다.
       ★메뉴 키를 넘기지 않는다★ — 홈은 특정 권한이 필요한 화면이 아니다. 권한이 하나도
         없는 계정에게도 홈은 열리고, applyMenus가 "아직 이용할 수 있는 화면이 없습니다"를
         띄운다. 여기서 막아 버리면 그 안내를 볼 자리 자체가 사라진다.
         (auth.js의 guard()는 인자가 없으면 파일명으로 메뉴 키를 찾지만, index.html은
          그 표에 일부러 넣지 않았다 — 홈은 언제나 열려야 한다.) */
    if (!(await Auth.guard())) return;
  }

  // ---------- 점검 모드 안내 ----------
  /* 서버 스크립트 속성 MAINT에 문구가 들어 있으면 모든 요청이 그 문구와 함께 거절된다
     (관리자 역할만 예외로 통과한다). 문구는 서버가 정하고 화면은 그대로 보여 주기만 한다. */
  function showMaint(msg) {
    const el = $('#maintNote');
    if (!el) return;
    el.textContent = msg || '';        // 서버 문구도 사용자 데이터다 — 반드시 textContent
    el.style.display = msg ? '' : 'none';
  }
  /* auth.js가 방금 지나간 응답에서 주워 둔 점검 문구. 없으면 ''.
     ★관리자가 점검을 켠 채 잊는 사고를 이 값으로 막는다★ — 관리자 역할은 점검 중에도 요청이
       통과하므로, 이 값을 보지 않으면 26곳이 전부 멈춰 있는 동안 담당자 화면만 멀쩡하다.
       (서버가 세션 응답에 maint 칸을 실어 주면 그때부터 관리자 화면에도 배너가 뜬다.
        지금은 거절 응답에서 주운 문구만 들어 있어 종전과 같이 동작한다.)
     구버전 auth.js가 캐시에 남아 있으면 ''이라 역시 종전과 같다. */
  function maintNow() {
    try {
      if (hasAuth && typeof Auth.maint === 'function') return String(Auth.maint() || '');
    } catch (e) { /* 구버전 auth.js */ }
    return '';
  }
  /* 점검 중이라는 사실은 '거절당한 응답'에만 들어 있다. 그래서 Auth.sync()가 실패했을 때만 부른다 —
     평소에는 왕복이 한 번도 늘지 않고, 오프라인이면 NETWORK가 돌아와 아무것도 표시하지 않는다.
     ★Auth.maint()가 있으면 왕복이 0회다★ — sync()가 방금 auth.session으로 받은 그 거절 응답에
       문구가 들어 있었고 auth.js가 그것을 기억한다. 없을 때만 한 번 더 물어본다. */
  async function maintMsg() {
    try {
      const m = maintNow();
      if (m) return m;
      // 오프라인이면 물어볼 것도 없다. 실패할 왕복을 한 번 더 만들지 않는다
      if (navigator.onLine === false) return '';
      if (typeof Api === 'undefined' || !Api || typeof Api.call !== 'function') return '';
      const r = await Api.call('auth.session', {});
      return (r && r.code === 'MAINT') ? String(r.error || '현재 점검 중입니다. 잠시 후 다시 이용해 주세요.') : '';
    } catch (e) { return ''; }
  }

  // ---------- 카드 필터 ----------
  const nav = $('#menu');
  const note = $('#menuNote');

  // 서버가 준 menus에서 그 키의 권한 객체를 꺼낸다. 읽기도 쓰기도 없으면 없는 것과 같다
  // (빈칸·오타는 전부 거짓 — 서버 '역할' 탭 규칙과 같은 방향). 역할 이름은 어디서도 보지 않는다
  function granted(menus, key) {
    for (let i = 0; i < (menus || []).length; i++) {
      const m = menus[i];
      if (m && m.key === key && (m.read || m.write)) return m;
    }
    return null;
  }
  // js/menu.js의 등록표가 그 키를 아는가 (알면 카드 정리는 Menu.apply가 이미 했다)
  function menuKnows(key) {
    try {
      if (typeof Menu === 'undefined' || !Menu || !Menu.REG) return false;
      for (let i = 0; i < Menu.REG.length; i++) if (Menu.REG[i] && Menu.REG[i].key === key) return true;
    } catch (e) { /* 구버전 menu.js */ }
    return false;
  }

  /* ★'계정 관리' 카드는 이 화면이 직접 여닫는다.
     js/menu.js의 등록표에 accounts가 없으면 Menu.apply()는 이 카드를 '모르는 카드'로 보아
     지우지도 남기지도 않는다 — 즉 매장 계정 화면에도 그대로 남는다. 그래서 여기서 판정한다.
     등록표에 accounts가 추가되더라도 이 함수는 그대로 두어야 한다. apply()는 인라인 style을
     지우지 않으므로, 기본 숨김인 이 카드는 누군가 display를 풀어 주지 않으면 관리자에게도 안 보인다.
     반환값은 '내가 추가로 세어야 할 카드 수'다(등록표가 알면 apply()가 이미 셌으므로 0). */
  function applyAccounts(menus) {
    const card = nav.querySelector('[data-menu="accounts"]');
    if (!card) return 0;
    const m = granted(menus, 'accounts');
    card.style.display = m ? '' : 'none';
    if (!m) return 0;
    // 등록표 카드들이 순서대로 재배치된 뒤라 그냥 붙이면 항상 맨 아래로 간다
    nav.appendChild(card);
    try {
      const tag = card.querySelector('.tag');
      // 뱃지는 역할명이 아니라 권한 라벨이다 (menu.js와 같은 규칙)
      if (tag && typeof Menu !== 'undefined' && Menu && typeof Menu.badgeOf === 'function') {
        tag.textContent = Menu.badgeOf(m);
      }
    } catch (e) { /* 구버전 menu.js — 정적 문구를 그대로 둔다 */ }
    return menuKnows('accounts') ? 0 : 1;
  }

  /* ★'관리자 도구' 카드도 이 화면이 직접 여닫는다★ (2026-08-26) — 등록표에 없는 키라
     Menu.apply()가 손대지 않기 때문이다('계정 관리'와 같은 구조).
     ★읽기로는 열지 않는다★ — 이 화면이 여는 것(제출 코드·계정·제출 관리)은 전부 쓰기다.
       읽기 권한만 있는 사람에게 보여 주면 눌러 봐야 서버가 거절하는 카드가 된다. */
  function applyAdminTools(menus) {
    const card = nav.querySelector('[data-menu="admin-tools"]');
    if (!card) return 0;
    const m = granted(menus, 'accounts');
    const on = !!(m && m.write);
    card.style.display = on ? '' : 'none';
    if (!on) return 0;
    nav.appendChild(card);   // 등록표 카드들이 재배치된 뒤라 맨 아래로 간다
    return 1;                // 등록표가 모르는 카드이므로 내가 센다
  }

  function applyMenus(menus) {
    if (!menus) return;                       // 오프라인 등 — 정적 카드를 그대로 둔다
    let left = menus.length;
    if (typeof Menu !== 'undefined' && Menu && typeof Menu.apply === 'function') {
      left = Menu.apply(menus, nav);
    }
    left += applyAccounts(menus);
    left += applyAdminTools(menus);
    /* 권한이 하나도 없으면 빈 화면 대신 이유를 말해 준다.
       ★'권한이 없습니다'로 끝내지 않는다★ — 매장 직원이 보는 화면이고, 잘못한 사람이 없는
         상황이다. 무엇을 하면 되는지까지 적어야 "앱이 고장났다"가 아니라 문의로 이어진다. */
    if (left === 0) {
      note.textContent = '아직 이용할 수 있는 화면이 없습니다. 감사총무팀에 문의해 주세요.';
      note.style.display = '';
    } else {
      note.style.display = 'none';
    }
  }

  /* 저장된 권한 사본. 오프라인·서버 왕복 전에도 카드가 걸러지도록 세션에서 바로 읽는다.
     ★Auth.menus()가 있으면 그쪽이 정본이고, 없는 구버전 auth.js가 캐시에 남아 있을 때만
     세션 객체에서 직접 꺼낸다. 두 경로가 다 실패해 null이 되면 카드를 하나도 걸러내지 않으므로
     (=정적 카드 전부 노출) 이 폴백을 지우면 안 된다. */
  function menusOf() {
    try {
      if (!hasAuth) return null;
      if (typeof Auth.menus === 'function') return Auth.menus();
      const s = (typeof Auth.session === 'function') ? Auth.session() : null;
      if (s && s.menus) return s.menus;
    } catch (e) { /* auth.js 미로드·구버전 */ }
    return null;
  }

  applyMenus(menusOf());

  // ---------- 하단: 이름 · 역할 / 비밀번호 변경 / 로그아웃 ----------
  function drawFoot() {
    if (!hasAuth || typeof Auth.user !== 'function') return;
    const u = Auth.user();
    if (!u || !u.id) return;
    // 사용자 데이터는 반드시 textContent로 (시트에서 온 이름이 그대로 들어온다)
    $('#who').textContent = (u.name || u.id) + ' · ' + (u.role || '');
    $('#act').style.display = '';
    /* 비밀번호 변경은 로그인한 모든 계정에 열어 둔다.
       비밀번호는 관리자가 정해서 알려주는 방식이지만, 매장이 스스로 바꾸고 싶어 하는
       경우까지 막을 이유는 없다(바꾸면 그 계정의 다른 기기는 즉시 로그아웃된다).
       역할 이름을 비교하지 않으므로 지역담당·팀장이 생겨도 이 줄은 안 바뀐다. */
    $('#pwBtn').style.display = '';
  }
  drawFoot();

  // ---------- 인앱 알림 배지 (notify.badge) ----------
  /* ★카드를 다 그린 뒤에 비동기로 붙인다★ — 이 액션은 매장 시트를 읽어야 해서 1~3초가 걸린다.
     기다렸다가 그리면 홈이 그동안 비어 있고, 지하 매장에서는 영영 안 열린 것처럼 보인다.
     그래서 await하지 않고 던져 두며, 실패하든 늦든 홈은 이미 완성되어 있어야 한다. */
  /* 마지막으로 받은 값. 두 가지 용도가 있다 —
       ① applyMenus가 카드를 다시 세워도 배지를 되붙인다(메모리 사본)
       ② 다음 진입에서 서버 왕복을 기다리지 않고 즉시 그린다(기기 사본)
     ★기기에 한 벌 남기는 이유★ — 위 1~3초 동안 배지가 뒤늦게 끼어들며 카드 폭이 밀려,
       마침 '매장별 QSC현황'을 누르려던 손가락이 옆 카드를 누른다. 사본이 어제 값이어도
       해가 없다 — 배지는 정확해야 하는 값이 아니라 '들어가 보게 만드는' 값이고,
       실제 건수는 매장현황 화면이 다시 세어 보여 준다.
     ★로그인 상태에서만 그린다★ — 공용 기기에서 로그아웃한 뒤 남의 건수가 보이면 안 된다. */
  const BKEY = 'qsc-badge-v1';
  const hasToken = (function () {
    try { return !!(hasAuth && typeof Auth.token === 'function' && Auth.token()); } catch (e) { return false; }
  })();
  let badge = hasToken ? (function () {
    try { return JSON.parse(localStorage.getItem(BKEY) || 'null'); } catch (e) { return null; }
  })() : null;

  function saveBadge(v) {
    try {
      if (v) localStorage.setItem(BKEY, JSON.stringify(v));
      else localStorage.removeItem(BKEY);
    } catch (e) { /* 사생활 모드·용량 초과 — 이번 화면에서만 보이면 그만이다 */ }
  }
  function drawBadge() {
    try {
      // badge가 null이면 Menu.mark가 기존 배지를 지우고 아무것도 그리지 않는다(관리자 전환 시 필요)
      if (typeof Menu !== 'undefined' && Menu && typeof Menu.mark === 'function') Menu.mark('store', badge, nav);
    } catch (e) { /* 구버전 menu.js가 캐시에 남아 있는 경우 — 배지만 없다 */ }
  }
  drawBadge();   // 사본이 있으면 왕복 0회로 먼저 그린다(뒤늦게 끼어들어 카드가 밀리는 것을 막는다)

  /* 홈화면 아이콘의 숫자 배지.
     안드로이드·PC 크롬에서 '홈 화면에 추가'로 설치한 경우에만 뜬다.
     ★iOS는 이 API를 구현하지 않아 아무 일도 일어나지 않는 것이 정상이다★ — 고장이 아니다.
     권한이 없으면 프라미스가 거부되는데, 그것 때문에 콘솔이 붉어질 이유가 없어 조용히 삼킨다. */
  function appBadge(n) {
    try {
      const p = (n > 0)
        ? (navigator.setAppBadge && navigator.setAppBadge(n))
        : (navigator.clearAppBadge && navigator.clearAppBadge());
      if (p && p.catch) p.catch(function () { /* 미지원·미허용 — 무시 */ });
    } catch (e) { /* 무시 */ }
  }

  async function loadBadge() {
    try {
      // 로그인 전에는 물어볼 것이 없고(서버도 토큰으로 매장을 정한다), 오프라인이면 실패할 왕복만 는다
      if (!hasToken) return;
      if (navigator.onLine === false) return;
      if (typeof Api === 'undefined' || !Api || typeof Api.call !== 'function') return;
      const r = await Api.call('notify.badge', {});
      /* 실패(네트워크·미구현·권한)면 아이콘 배지까지 지우지 않는다 —
         지난번 숫자가 남아 있는 편이, 실제로는 밀린 일이 있는데 0으로 지워지는 것보다 낫다.
         화면에 그려 둔 사본 배지도 그대로 둔다(같은 이유). */
      if (!r || !r.ok) return;
      /* 관리자 계정에는 store가 아예 오지 않는다(담당 매장이 없으므로 홈 배지도 없다).
         이때는 사본까지 지운다 — 매장 계정으로 쓰던 기기에 관리자가 로그인하면
         남의 매장 건수가 계속 붙어 있게 된다. */
      if (!r.store) { badge = null; saveBadge(null); drawBadge(); appBadge(0); return; }
      badge = r.store;
      saveBadge(badge);
      drawBadge();
      appBadge(Number(badge.todo) || 0);
    } catch (e) { /* 배지는 없어도 그만이다 — 홈이 깨지는 쪽이 비교할 수 없이 나쁘다 */ }
  }
  loadBadge();   // ★await하지 않는다

  $('#pwBtn').onclick = function () {
    location.href = 'login.html?mode=changepw&next=index.html';
  };
  $('#outBtn').onclick = function () {
    if (!confirm('로그아웃할까요?')) return;
    /* 세션이 무기한이라 로그아웃은 사용자가 세션을 끊을 수 있는 유일한 수단이다.
       ★Auth.logout()을 먼저 쓴다 — 저장물 정리와 화면 이동이 거기 한곳에 모여 있다.
         구버전 auth.js가 캐시에 남아 logout()이 없을 때만 clear()로 내려간다. */
    // 남의 매장 건수가 다음 사람 화면에 남지 않게, 세션보다 먼저 배지 사본을 지운다
    saveBadge(null);
    appBadge(0);
    try {
      if (hasAuth && typeof Auth.logout === 'function') { Auth.logout(); return; }
      if (hasAuth && typeof Auth.clear === 'function') Auth.clear(true);
    } catch (e) { /* 무시 */ }
    location.replace('login.html');
  };

  // ---------- auth.session으로 갱신 후 1회 재필터 ----------
  /* 시트에서 역할을 고치면 여기서 반영된다. 실패해도(오프라인·미로그인) 조용히 넘어간다 —
     이 화면은 이미 저장된 사본으로 완전히 동작하고 있고, 서버 판정은 어차피 각 액션에서 다시 한다. */
  /* ★Api.call('auth.session') + Auth.save(응답) 조합을 쓰면 안 된다.
     auth.session 응답에는 token이 없는데 save()는 t: r.token으로 세션을 통째로 다시 쓴다 →
     토큰이 사라져 홈을 한 번 열 때마다 로그아웃된다. Auth.sync()가 바로 이 용도로 있고,
     토큰을 보존한 채 user/stores/menus만 갱신한다. */
  try {
    if (hasAuth && typeof Auth.sync === 'function' && typeof Auth.token === 'function' && Auth.token()) {
      if (await Auth.sync()) {
        applyMenus(menusOf() || []);
        drawFoot();
        // applyMenus가 카드를 다시 세우면 먼저 붙어 있던 배지가 사라진다. 받아 둔 값으로 되붙인다
        drawBadge();
        /* ★sync가 성공했다고 점검이 아닌 것은 아니다★ — 관리자 역할은 점검 중에도 통과한다.
           서버가 세션 응답에 maint 칸을 실어 주면 여기서 그 문구가 뜨고, 담당자는 자기 화면에서
           "내가 점검을 켜 둔 채였구나"를 즉시 안다. 칸이 없는 지금은 ''이라 종전처럼 안내가 내려간다. */
        showMaint(maintNow());
      } else {
        showMaint(await maintMsg());
      }
    }
  } catch (e) { /* 갱신 실패는 치명적이지 않다 */ }

  // ---------- 평가표 버전 ----------
  try {
    const m = await (await fetch('data/master.json', { cache: 'no-store' })).json();
    /* ★#foot 만 갈아 끼운다★ — 앱 버전 도장(js/auth.js)은 그 바깥 .homeFoot 에 붙으므로
       여기서 지워지지 않는다. textContent 를 .homeFoot 에 쓰면 도장이 사라진다. */
    $('#foot').textContent = 'GLOW SEOUL · 평가표 ' + m.version + ' 기준';
  } catch (e) { /* 오프라인 등 — 기본 문구 유지 */ }
})();
if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js');
</script>
</body>
</html>
