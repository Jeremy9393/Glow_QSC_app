<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>로그인 — GLOW SEOUL QSC</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#000000">
<link rel="icon" href="icons/icon-192-v2.png">
<link rel="apple-touch-icon" href="icons/icon-192-v2.png">
<link rel="stylesheet" href="css/app.css?v=77">
</head>
<body>
<div class="home">
  <div class="homeBrand">GLOW SEOUL</div>
  <div class="homeSub">QSC 평가 시스템</div>

  <!-- form으로 감싸야 모바일 키보드의 '완료'와 Enter로 제출된다.
       ★2026-08-16에 아이디 칸의 자동완성을 껐다★ — 종전에는 name="username" +
       autocomplete="username"으로 두어 비밀번호 관리자의 저장 제안을 받았는데, 그 대가로
       폰에 저장된 이메일 주소가 매장 화면에 먼저 제시됐다. 아이디는 이제 <select>로 고르므로
       그 신호가 필요 없다. 비밀번호 칸의 current-password는 그대로 두었다 — 이메일을 흘리지
       않으면서 저장된 비밀번호는 여전히 받을 수 있다. -->
  <form class="card loginCard" id="loginForm" autocomplete="on">
    <h2 id="cardTitle">로그인</h2>

    <!-- 점검 모드 안내. 서버 스크립트 속성 MAINT에 적힌 문구를 그대로 보여준다.
         ★.mockNote(점선 앰버)를 쓴다 — 홈·전체 대시보드·매장현황의 점검 안내와 같은 클래스다.
           화면마다 다른 클래스를 쓰면 같은 상태가 화면마다 다르게 보이고, css/app.css에
           정의를 하나 더 얹어야 한다. 점검 안내의 모양은 앱 전체에서 한 벌이어야 한다. -->
    <p class="note mockNote" id="maint" style="display:none"></p>

    <!-- 로그인 칸 -->
    <div id="stepLogin">
      <div class="meta-grid">
        <!-- 아이디는 ★고르는 것★이지 치는 것이 아니다 (2026-08-16).
             종전에는 <input list=storeIds> 였는데, 브라우저·비밀번호 관리자가 그 칸을
             '아이디 칸'으로 알아보고 폰에 저장된 이메일 주소를 먼저 제안했다. 매장이 볼 화면에
             남의 이메일이 뜨는 것이라 그대로 둘 수 없다. <select>는 자동완성 대상이 아니다.
             ★목록은 login-app.js의 fillStores가 채운다★ — data/master.json(즉시) →
               서버 config.stores(최신본으로 덮어쓰기). 서버 목록은 통합시트에서 숨김 행·
               필터 행·소계 행을 이미 걸러낸 '운영 중인 매장'이다. -->
        <div class="full">
          <label class="f" for="lidSel">아이디 <span class="fHint">매장을 골라 주세요</span></label>
          <select id="lidSel">
            <option value="">— 불러오는 중… —</option>
          </select>
        </div>
        <!-- 직접 입력 칸. 평소에는 접혀 있고 두 경우에만 열린다 —
             ①드롭다운에서 '직접 입력…'을 고른 경우 ②기억된 아이디가 목록에 없는 경우(관리자 계정,
             아직 통합시트에 없는 새 매장). ★목록을 못 받았을 때도 열린다★ — 목록이 비었다고
             로그인 자체가 막히면 안 된다.
             ★name을 'username'으로 두지 않는다★ — 그 이름이 곧 브라우저에게 "여기에 저장된
               아이디를 넣어라"는 신호였다. autocomplete=off만으로는 크롬이 무시한다. -->
        <div class="full" id="lidManual" style="display:none">
          <label class="f" for="lid">아이디 직접 입력</label>
          <input type="text" id="lid" name="qsc-store-id" autocomplete="off"
                 autocapitalize="none" autocorrect="off" spellcheck="false"
                 placeholder="예: 청수당 익선">
        </div>
        <div class="full">
          <label class="f" for="lpw">비밀번호</label>
          <input type="password" id="lpw" name="password" autocomplete="current-password">
        </div>
      </div>
      <!-- '비밀번호 가리기' 체크박스는 2026-08-16에 없앴다 — 비밀번호 칸 안의 눈 버튼이
           같은 일을 하고, 가리는 대상 바로 위에 있어 무엇을 켜고 끄는지 설명이 필요 없다.
           눈 버튼은 login-app.js의 bindEye가 만든다. -->
      <!-- 아이디만 기기에 남긴다(qsc-login-id-v1). 비밀번호는 앱이 어디에도 저장하지 않는다 -->
      <label class="chkRow" for="rememberId">
        <input type="checkbox" id="rememberId" checked>
        <span>아이디 기억하기</span>
      </label>
    </div>

    <!-- 비밀번호 설정 칸 — SET_PW 응답이 오면 위 칸을 감추고 이 칸만 드러낸다 (화면을 늘리지 않는다).
         평소에는 쓰이지 않는 경로다: 비밀번호는 관리자가 계정 관리 화면에서 정해 알려 준다. -->
    <div id="stepPw" style="display:none">
      <div class="meta-grid">
        <div class="full">
          <label class="f" for="np1">새 비밀번호</label>
          <input type="password" id="np1" name="new-password" autocomplete="new-password">
        </div>
        <div class="full">
          <label class="f" for="np2">새 비밀번호 확인</label>
          <input type="password" id="np2" name="new-password-confirm" autocomplete="new-password">
        </div>
      </div>
      <p class="note">8자 이상 · 아이디와 다르게 · 발급받은 설정코드와 다르게 정해 주세요.</p>
    </div>

    <!-- 비밀번호 변경 칸 — 홈의 [비밀번호 변경]이 ?mode=changepw 로 보낸다.
         위 두 칸과 달리 '현재 비밀번호'를 함께 받는다(서버가 토큰 + curPw로 본인 확인을 한다). -->
    <div id="stepChg" style="display:none">
      <div class="meta-grid">
        <div class="full">
          <label class="f" for="cp0">현재 비밀번호</label>
          <input type="password" id="cp0" name="current-password" autocomplete="current-password">
        </div>
        <div class="full">
          <label class="f" for="cp1">새 비밀번호</label>
          <input type="password" id="cp1" name="new-password" autocomplete="new-password">
        </div>
        <div class="full">
          <label class="f" for="cp2">새 비밀번호 확인</label>
          <input type="password" id="cp2" name="new-password-confirm" autocomplete="new-password">
        </div>
      </div>
      <p class="note">8자 이상 · 아이디와 다르게 · 지금 비밀번호와 다르게 정해 주세요.</p>
    </div>

    <button class="issueBtn" type="submit" id="goBtn">로그인</button>
    <p class="note noteErr" id="msg" style="display:none"></p>
  </form>

  <p class="note loginFoot" id="loginFoot">비밀번호를 잊으셨으면 감사총무팀에 문의해 주세요.</p>
  <div class="homeFoot">GLOW SEOUL · QSC</div>
</div>

<script src="js/auth.js?v=77"></script>
<script src="js/login-app.js?v=77"></script>
<script>if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js');</script>
</body>
</html>
