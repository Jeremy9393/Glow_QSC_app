<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>QSC 점검 — GLOW SEOUL</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#000000">
<link rel="icon" href="icons/icon-192-v2.png">
<link rel="apple-touch-icon" href="icons/icon-192-v2.png">
<link rel="stylesheet" href="css/app.css?v=16">
</head>
<body>
<header class="topbar">
  <a class="back" href="index.html">←</a>
  <div class="tt"><span class="brand">GLOW SEOUL</span><span class="title">QSC 점검 <span class="sub">관리자</span></span></div>
  <span class="sub" id="verInfo"></span>
  <button id="resetBtn" class="resetBtn">초기화</button>
</header>
<div class="wrap">
  <section class="card">
    <div class="meta-grid">
      <div class="full"><label class="f">매장명 *</label><select id="store"><option value="">매장 선택</option></select></div>
      <div><label class="f">점검일자</label><input type="date" id="date"></div>
      <div><label class="f">점검자</label><input type="text" id="inspector" placeholder="이름"></div>
    </div>
  </section>
  <nav class="gnav" id="gnav"></nav>
  <div id="groups"></div>
  <section class="card" id="summary">
    <h2>항목별 집계</h2>
    <table class="sumTable">
      <thead><tr><th>항목</th><th class="r">점수</th><th class="r">가중치</th><th class="r">가중반영</th></tr></thead>
      <tbody id="sumBody"></tbody>
    </table>
    <div class="sumFinal" id="sumFinal">—</div>
    <p class="note">등급 기준: 우수 93점 초과 · 양호 85 이상 · 보통 76 이상 · 미흡 66 이상 · 주의 55 이상 · 부적합 55 미만 / NA 문항은 채점 제외, 그룹 전체 NA면 가중치가 다른 그룹으로 재분배</p>
    <h2>적발 문항</h2>
    <div id="offList" class="offList"></div>
  </section>
  <p class="note" id="saveNote"></p>
</div>
<footer class="bottombar"><div class="in">
  <div class="bb-score">
    <span class="big" id="bbScore">—</span><span class="grade" id="bbGrade"></span>
    <span class="prog" id="bbProg">적발 0건 · NA 0</span>
  </div>
  <button class="submit" id="submitBtn">제출</button>
</div></footer>
<input type="file" id="photoInput" accept="image/*" multiple hidden>
<script src="js/scoring.js?v=16"></script>
<script src="js/api.js?v=16"></script>
<script src="js/qsc-app.js?v=16"></script>
<script>if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js');</script>
</body>
</html>
