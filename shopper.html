<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>미스터리쇼퍼 평가표 — GLOW SEOUL</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#000000">
<link rel="icon" href="icons/icon-192-v2.png">
<link rel="apple-touch-icon" href="icons/icon-192-v2.png">
<link rel="stylesheet" href="css/app.css?v=31">
</head>
<body>
<header class="topbar">
  <a class="back" href="index.html">←</a>
  <div class="tt"><span class="brand">GLOW SEOUL</span><span class="title">미스터리쇼퍼 평가표 <span class="sub">관리자</span></span></div>
  <span class="sub" id="verInfo"></span>
  <button id="resetBtn" class="resetBtn">초기화</button>
</header>
<div class="wrap" id="formWrap">
  <a class="codesLink" href="codes.html">제출 코드 관리 <span class="arrow">›</span></a>
  <a class="surveyLink" href="survey.html">고객용 미스터리쇼퍼 설문지 열기 <span class="arrow">›</span></a>
  <section class="card guide" id="guideBox"></section>
  <section class="card" id="metaBox"></section>
  <div id="cats"></div>
  <section class="card" id="summary">
    <h2>카테고리별 집계</h2>
    <table class="sumTable">
      <thead><tr><th>카테고리</th><th class="r">환산 점수</th><th class="r">응답/문항</th><th class="r">NA 건</th><th class="r">달성률</th></tr></thead>
      <tbody id="sumBody"></tbody>
    </table>
    <div class="sumFinal" id="sumFinal">—</div>
    <p class="note">점수 = 환산 점수 합계 ÷ 응답 문항 수 × 100 (NA·미응답 제외) / 등급 기준: 우수 93점 이상 · 양호 85 이상 · 보통 76 이상 · 미흡 66 이상 · 주의 55 이상 · 부적합 55 미만 / 본 평가는 최종 점수의 30% 반영</p>
    <p class="note pre" id="rulesNote"></p>
  </section>
  <p class="note" id="saveNote"></p>
</div>
<footer class="bottombar" id="bar"><div class="in">
  <div class="bb-score">
    <span class="big" id="bbScore">—</span><span class="grade" id="bbGrade"></span>
    <span class="prog" id="prog">0 / 40 응답</span>
    <div class="progressbar"><div class="fill" id="fill"></div></div>
  </div>
  <button class="submit" id="submitBtn">제출</button>
</div></footer>

if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js');
</script>

</html>
