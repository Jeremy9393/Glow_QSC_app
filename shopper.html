<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

<link rel="manifest" href="manifest.json">

<body>
<header class="topbar">
  <a class="back" href="index.html">←</a>
  <div class="tt"><span class="brand">GLOW SEOUL</span><span class="title">MS 평가표 <span class="sub">관리자</span></span></div>
  <span class="sub" id="verInfo"></span>
  <button id="resetBtn" class="resetBtn">초기화</button>
</header>
<div class="wrap" id="formWrap">
  <!-- 부드러운 가드 안내. 기본은 숨김이고, 세션이 없을 때만 아래 스크립트가 켠다.
       리다이렉트를 하지 않으므로 작성 중이던 내용은 그대로 남는다. -->
  <p class="note mockNote authNote" id="authNote" style="display:none">
    로그인한 뒤 이용할 수 있습니다. · <a href="login.html?next=shopper.html">로그인</a>
  </p>
  <a class="codesLink" href="codes.html">제출 코드 관리 <span class="arrow">›</span></a>
  <a class="surveyLink" href="survey.html">고객 설문 열기 <span class="arrow">›</span></a>
  <section class="card guide" id="guideBox"></section>
  <section class="card" id="metaBox"></section>
  <!-- 관리자 입력일 때만 채워진다 (고객 설문에는 뜨지 않는다 — 고객은 판단할 수 없다) -->
  <p class="note mockNote pre" id="dupNote" style="display:none"></p>
  <div id="cats"></div>
  <!-- 카테고리별 집계표는 뺐다 (2026-08-27) — 고객용 화면에는 없는 칸이고,
       admin:false 에서는 채워지지 않아 빈 표만 남는다.
       점수는 제출 뒤 「매장별 QSC현황」에서 본다. -->
  <p class="note" id="saveNote"></p>
</div>
<!-- ★제출 뒤 화면★ — admin:false 경로는 js/shopper-core.js:466~468 이 이 칸을 편다.
     이 요소가 없으면 제출 성공 직후 TypeError 로 죽는다(화면이 그대로 멈춘 것처럼 보인다).
     문구는 담당자용이다 — 손님이 보는 survey.html 의 감사 문구와는 다르다. -->
<div class="thanks" id="thanks" style="display:none">
  <div class="b">GLOW SEOUL</div>
  <h1>제출이 완료되었습니다</h1>
  <p>점수는 <b>매장별 QSC현황</b>에서 「잠정」으로 먼저 보이고,<br>
     매장 파일·통합시트에는 그 달 말일 23시에 반영됩니다.</p>
  <p style="margin-top:18px"><a href="index.html">홈으로</a></p>
</div>
<footer class="bottombar" id="bar"><div class="in">
  <div class="bb-score">
    <!-- 점수·등급 표시는 뺐다 (2026-08-27) — 고객용과 같은 모습으로 통일.
         진행률만 남긴다. 문항은 38개다(옛 표기 40은 낡은 숫자였다). -->
    <span class="prog" id="prog">0 / 38 응답</span>
    <div class="progressbar"><div class="fill" id="fill"></div></div>
  </div>
  <button class="submit" id="submitBtn">제출</button>
</div></footer>
<!-- auth.js는 항상 가장 먼저. api.js가 토큰을 본문에 실으려면 이 파일이 먼저 있어야 하고,
     topbar의 로그아웃 버튼도 auth.js가 붙인다.
     ★이 화면에서도 guard()는 절대 부르지 않는다 — 리다이렉트 금지.
       고객용 survey.html과 달리 이 화면은 관리자용이지만, 현장에서 작성 중이던 내용이
       로그인 화면으로 튕기며 날아가는 사고는 똑같이 비싸다. -->
<script src="js/maint.js?v=134"></script>
<script src="js/ui-busy.js?v=134"></script>
<script src="js/auth.js?v=134"></script>
<script src="js/scoring.js?v=134"></script>
<script src="js/api.js?v=134"></script>
<script src="js/ui-time.js?v=134"></script>
<script src="js/shopper-core.js?v=134"></script>
<script>
/* ★고객용 화면으로 통일했다★ (2026-08-27 담당자 결정)
     "관리자가 보는MS평가표랑 고객용MS평가표가 일부 구조가 다를꺼야
      그래서 고객용MS평가표로 통일한다는뜻"
   admin:false 하나로 화면·제출 경로가 전부 고객용과 같아진다 —
   문항·안내는 원래부터 js/shopper-core.js 한 파일이 그리던 것이고,
   점수 미리보기·NA 버튼·평가기준 안내만 관리자에게 더 보이던 것이었다.
   제출도 고객과 같은 길(제출 코드)로 간다 — 담당자는 「제출 코드 관리」에서 한 장 받아 쓴다.
   ★survey.html 은 안 고쳤다★ — 손님 화면은 로그인 부품을 싣지 않는 격리 상태 그대로여야 하고,
     인쇄·발송된 QR 26장이 그 주소를 가리킨다. */
initShopperForm({ admin: false });

/* 부드러운 가드 — 리다이렉트하지 않는다. 로그인하지 않았거나 권한 없는 계정이면 문항을 감추고(2026-09-17) 제출을 잠근다. (qsc.html과 같은 내용)
   ★js/shopper-core.js는 한 줄도 고치지 않는다. 그 파일은 제출을 시도한 뒤에만 disabled를
     되돌리므로, 여기서 잠가 두면 사용자가 로그인하기 전까지 잠긴 채로 남는다. */
(function () {
  /* 실제로 잠그기 시작하는 시점을 이 한 줄이 정한다 (서버 AUTH_ENFORCE와 짝이고,
     index.html의 LOGIN_GATE와도 같은 뜻이다).
     v35에서 로그인 벽을 켜기로 해 index.html·qsc.html과 함께 true로 올렸다.
     ★그래도 리다이렉트는 하지 않는다★ 안내문을 켜고 제출 버튼만 잠근다 —
       현장에서 작성 중이던 평가가 로그인 화면으로 튕기며 날아가는 사고는 똑같이 비싸다. */
  var LOGIN_GATE = true;
  if (!LOGIN_GATE) return;

  var note = document.getElementById('authNote');
  var btn = document.getElementById('submitBtn');
  function lock(text) {
    if (note) note.style.display = '';
    if (btn) { btn.disabled = true; btn.textContent = text; }
  }

  /* ★로그인하지 않았으면 문항을 감춘다 — 오프라인이어도★ (2026-09-17 담당자 · qsc.html 과 같은 규칙·같은 이유)
     종전에는 오프라인·저장소 모름이면 통과, 로그인 안 했으면 제출 버튼만 잠가 앱 아이콘 바로가기로
     로그인 없이 38문항이 보였다. 토큰이 있어야만 보인다 · 지우지 않고 감추기만 한다(임시저장 유지). */
  var signedIn = false;
  try {
    localStorage.setItem('qsc-probe', '1');
    localStorage.removeItem('qsc-probe');
    if (typeof Auth !== 'undefined' && Auth && typeof Auth.token === 'function') signedIn = !!Auth.token();
  } catch (e) { signedIn = false; }
  if (!signedIn) {
    lock('로그인 후 이용');
    document.body.classList.add('noAccess');
    return;
  }

  /* 로그인한 평가자는 오프라인이면 잠그지 않는다 (확정사항 8) — 서버가 권한 없는 요청을 거절한다 */
  if (navigator.onLine === false) return;

  /* ② 로그인은 되어 있으나 이 화면 권한이 없는 계정(매장 등). qsc.html과 같은 규칙이다 —
     리다이렉트하지 않고, menus()가 null이면(=아직 모른다) 손대지 않는다.
     진짜 차단은 서버가 한다(shopper.submit은 등록표에서 menu:'shopper' 쓰기). */
  var known = null;
  try {
    if (typeof Auth !== 'undefined' && Auth && typeof Auth.menus === 'function') known = Auth.menus();
  } catch (e) { known = null; }
  if (!known) return;
  if (typeof Auth.can !== 'function') return;

  /* ★관리자 화면으로 가는 문을 먼저 치운다★ — 이 화면 맨 위의 '제출 코드 관리'는 늘 떠 있는
     고정 링크라, 매장 계정이 여기까지 들어오면 codes.html 주소를 그대로 알게 된다.
     codes.html도 guard('codes')로 막혀 있지만, 눌러서 튕기는 것보다 안 보이는 편이 낫다. */
  if (!Auth.can('codes', '읽기')) {
    var cl = document.querySelector('.codesLink');
    if (cl) cl.style.display = 'none';
  }
  if (Auth.can('shopper', '쓰기')) return;

  /* 안내문을 통째로 갈아 끼운다 — 원래 문구의 '로그인' 링크를 남기면
     이미 로그인한 매장 직원이 로그인 화면만 오가게 된다. textContent라 링크도 함께 지워진다. */
  if (note) note.textContent = '이 평가표는 감사총무팀 담당자용입니다. 매장 개선요청사항은 홈의 「매장별 QSC현황」에서 확인하실 수 있습니다.';
  lock('담당자만 제출할 수 있습니다');
  /* ★문항 목록도 감춘다★ (2026-09-17 담당자 — qsc.html 과 같은 장치) */
  document.body.classList.add('noAccess');
})();

/* 뒤로가기를 눌렀을 때 한 번 되묻는다. (qsc.html과 같은 장치·같은 이유)
   ※사진은 이 화면에서 다루지 않는다 (영수증 첨부를 2026-08-20에 없앴다).
   ★beforeunload를 쓰지 않는다★ — js/shopper-core.js가 제출 성공 뒤 화면을 갈아 끼우는데,
     그 파일은 내 담당이 아니라 해제 신호를 넣을 수 없어 정상 흐름에도 경고창이 뜬다.
   ★capture 단계에서 document에 위임한다★ — 두 뒤로가기 버튼 모두 auth.js가 나중에 만든다. */
(function () {
  var dirty = false;
  function markDirty() { dirty = true; }
  document.addEventListener('input', markDirty, true);
  document.addEventListener('change', markDirty, true);
  var body = document.getElementById('cats');
  if (body) body.addEventListener('click', markDirty, true);   // 척도 버튼은 input/change를 내지 않는다

  document.addEventListener('click', function (e) {
    if (!dirty) return;
    var el = e.target;
    for (; el && el !== document; el = el.parentNode) {
      if (el.id === 'backBottom' || (el.className && String(el.className).indexOf('back') === 0)) break;
    }
    if (!el || el === document) return;
    /* 이 화면은 사진을 다루지 않는다(영수증 첨부 2026-08-20 삭제) — qsc.html 문구를 옮겨 온 「사진은 …」을 뺐다 (2026-09-17) */
    if (confirm('작성 중인 내용이 있습니다.\n이 화면을 나가시겠습니까?')) return;
    e.preventDefault();
    e.stopPropagation();   // capture 단계라 버튼의 onclick까지 막힌다
  }, true);
})();
if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js');
</script>
</body>
</html>
