<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>미스터리쇼퍼 설문지 — GLOW SEOUL</title>
<meta name="theme-color" content="#000000">
<link rel="icon" href="icons/icon-192-v2.png">
<link rel="apple-touch-icon" href="icons/icon-192-v2.png">
<link rel="stylesheet" href="css/app.css?v=80">
</head>
<body>
<header class="topbar">
  <div class="tt"><span class="brand">GLOW SEOUL</span><span class="title">미스터리쇼퍼 설문지</span></div>
  <!-- 관리자 평가표(shopper.html)와 같은 자리·같은 버튼이다. 고객도 잘못 골라 둔 답을
       처음부터 다시 하고 싶을 때가 있는데, 종전에는 지울 길이 없어 브라우저 데이터를
       지우는 수밖에 없었다. 누르면 한 번 물어본다. -->
  <button id="resetBtn" class="resetBtn">초기화</button>
</header>
<div class="wrap" id="formWrap">
  <section class="card guide" id="guideBox"></section>
  <section class="card" id="metaBox"></section>
  <div id="cats"></div>
  <p class="note" id="saveNote"></p>
</div>
<div class="thanks" id="thanks" style="display:none">
  <div class="b">GLOW SEOUL</div>
  <h1>제출이 완료되었습니다</h1>
  <p>소중한 의견 감사합니다.<br>보내주신 응답은 매장 서비스 개선에 사용됩니다.</p>
</div>
<footer class="bottombar" id="bar"><div class="in">
  <div class="bb-score">
    <span class="prog" id="prog">0 / 40 응답</span>
    <div class="progressbar"><div class="fill" id="fill"></div></div>
  </div>
  <button class="submit" id="submitBtn">제출</button>
</div></footer>
<script src="js/scoring.js?v=80"></script>
<script src="js/api.js?v=80"></script>
<script src="js/ui-time.js?v=80"></script>
<script src="js/shopper-core.js?v=80"></script>
<script>
initShopperForm({ admin: false });

/* 뒤로가기 — 이 화면만 인라인이다.
   ★이 화면은 auth.js를 싣지 않는다★ 손님이 QR로 익명 진입하는 화면이라 그것이 설계다.
     그래서 auth.js의 mountBack()을 쓸 수 없고, 같은 모양(왼쪽 위 화살표)만 여기서 직접 만든다.
   ★앱 안쪽으로 가는 링크를 절대 만들지 않는다★ index.html 같은 본사 화면 주소를 fallback으로
     박아두면, 손님이 뒤로가기 한 번으로 본사 앱에 들어온다. 그래서 history.back()만 부른다.
   ★돌아갈 곳이 확실할 때만 그린다★
     - history.length <= 1  : 돌아갈 기록이 없다(QR로 새 탭에 열린 대부분의 손님)
     - referrer가 이 앱     : 돌아가면 본사 화면이다. 안 그리는 편이 안전하다
     눌러도 아무 일이 없거나 위험한 버튼은 애초에 보이지 않는 것이 맞다. */
(function () {
  var ref = '';
  try { ref = document.referrer || ''; } catch (e) { ref = ''; }
  if (ref.indexOf(location.origin) === 0) return;   // 앱 안쪽에서 왔다 — 그리지 않는다
  if (history.length <= 1) return;                  // 돌아갈 기록이 없다
  var b = document.createElement('button');
  b.id = 'backFloat';
  b.type = 'button';
  b.className = 'backFloat';
  b.textContent = '←';
  b.setAttribute('aria-label', '뒤로');
  b.onclick = function () { history.back(); };   // 주소를 한 글자도 쓰지 않는다
  document.body.appendChild(b);
})();
if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js');
</script>
</body>
</html>
